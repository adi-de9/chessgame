<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Wizard's Chess - Gothic Cathedral (60 FPS Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cinzel for Gothic flavor, Inter for clean Material UI, Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"
      rel="stylesheet"
    />
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Chess.js for legal Chess Rules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
      :root {
        --md-surface: rgba(20, 18, 26, 0.86);
        --md-outline: rgba(255, 255, 255, 0.12);
      }
      * {
        user-select: none;
        -webkit-user-select: none;
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0a0e;
        font-family: "Inter", sans-serif;
      }
      .font-gothic {
        font-family: "Cinzel", serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
      }
      canvas:active {
        cursor: grabbing;
      }
      /* Material Design 3 Surface */
      .md-bar {
        background: var(--md-surface);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--md-outline);
        box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.65);
      }
      .md-chip {
        transition:
          transform 0.15s ease,
          background-color 0.15s ease,
          border-color 0.15s ease;
      }
      .md-chip:hover {
        background: rgba(208, 188, 255, 0.14);
        transform: translateY(-1px);
      }
      .md-chip:active {
        transform: translateY(0px) scale(0.97);
      }
      .md-chip-active {
        background: rgba(208, 188, 255, 0.22);
        border-color: rgba(208, 188, 255, 0.5);
        color: #eaddff;
      }
      .material-symbols-rounded {
        font-size: 19px;
        line-height: 1;
        vertical-align: middle;
      }
      @keyframes pulse-danger {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.65);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
        }
      }
      .check-pulse {
        animation: pulse-danger 1.6s infinite;
      }
    </style>
  </head>
  <body class="text-slate-100 antialiased">
    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- SINGLE-LEVEL MATERIAL DESIGN NAVIGATION BAR -->
    <header
      class="fixed top-3 sm:top-4 left-1/2 -translate-x-1/2 z-20 w-[96%] max-w-6xl pointer-events-none"
    >
      <nav
        class="md-bar rounded-full px-3 sm:px-5 py-2 flex flex-wrap items-center justify-between gap-2 pointer-events-auto"
      >
        <!-- Brand & Performance Badge -->
        <div class="flex items-center gap-2.5 pl-1">
          <div
            class="w-9 h-9 rounded-full bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-300"
          >
            <span class="material-symbols-rounded">castle</span>
          </div>
          <div class="hidden sm:block">
            <div class="flex items-center gap-2">
              <h1
                class="font-gothic text-sm md:text-base font-bold tracking-wider text-amber-100 leading-tight"
              >
                WIZARD'S CHESS
              </h1>
              <span
                id="fps-badge"
                class="text-[10px] font-mono font-semibold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
                >60 FPS</span
              >
            </div>
            <p class="text-[10px] text-slate-400 tracking-wide">
              GOTHIC SANCTUARY
            </p>
          </div>
        </div>

        <!-- Live Turn & Status Pill (Center) -->
        <div
          id="status-pill"
          class="flex items-center gap-2.5 bg-black/45 border border-white/10 rounded-full px-3.5 py-1.5 transition-all duration-200"
        >
          <span
            id="turn-dot"
            class="w-3 h-3 rounded-full bg-stone-100 shadow-[0_0_8px_rgba(255,255,255,0.85)]"
          ></span>
          <span
            id="status-text"
            class="text-xs sm:text-sm font-semibold tracking-wide text-slate-100"
            >Marble's Turn</span
          >
          <span
            id="captured-summary"
            class="hidden lg:inline-block text-xs text-slate-400 border-l border-white/10 pl-2.5 ml-1 font-mono"
            >Shattered: 0 - 0</span
          >
        </div>

        <!-- Single-Level Action Chips -->
        <div class="flex items-center gap-1.5 sm:gap-2">
          <!-- Game Mode Toggle (vs AI / 2P) -->
          <button
            id="btn-mode"
            class="md-chip md-chip-active flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs sm:text-sm font-medium border border-white/10 text-slate-200"
            title="Toggle AI vs 2-Player"
          >
            <span id="icon-mode" class="material-symbols-rounded"
              >smart_toy</span
            >
            <span id="label-mode" class="hidden md:inline">vs Wizard AI</span>
          </button>

          <!-- Camera Preset Cycle -->
          <button
            id="btn-camera"
            class="md-chip flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs sm:text-sm font-medium border border-white/10 text-slate-200"
            title="Cycle Camera Angle"
          >
            <span class="material-symbols-rounded">videocam</span>
            <span id="label-camera" class="hidden md:inline">White View</span>
          </button>

          <!-- Sound Toggle -->
          <button
            id="btn-sound"
            class="md-chip flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full border border-white/10 text-slate-200"
            title="Toggle Cathedral Audio"
          >
            <span id="icon-sound" class="material-symbols-rounded"
              >volume_up</span
            >
          </button>

          <!-- New Game Action -->
          <button
            id="btn-reset"
            class="md-chip flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs sm:text-sm font-semibold bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-200"
            title="Reset Board"
          >
            <span class="material-symbols-rounded">restart_alt</span>
            <span class="hidden sm:inline">New Game</span>
          </button>
        </div>
      </nav>
    </header>

    <!-- Bottom Subtle Interactive Hint & Combat Feed -->
    <footer
      class="fixed bottom-3 sm:bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none flex flex-col items-center gap-2 w-[94%] max-w-xl"
    >
      <div
        id="combat-banner"
        class="opacity-0 transform translate-y-2 transition-all duration-200 md-bar rounded-full px-4 py-1 text-xs font-semibold tracking-wider uppercase text-amber-300 border border-amber-400/30"
      >
        Knight strikes Pawn!
      </div>
      <div
        class="md-bar rounded-full px-4 py-1.5 text-[11px] sm:text-xs text-slate-400 flex items-center gap-3 sm:gap-4 pointer-events-auto"
      >
        <span class="flex items-center gap-1"
          ><i class="material-symbols-rounded text-sm text-amber-400"
            >touch_app</i
          >
          Tap piece &amp; target square</span
        >
        <span class="hidden sm:inline text-white/20">|</span>
        <span class="hidden sm:flex items-center gap-1"
          ><i class="material-symbols-rounded text-sm text-amber-400"
            >3d_rotation</i
          >
          Drag to orbit</span
        >
        <span class="text-white/20">|</span>
        <span class="flex items-center gap-1"
          ><i class="material-symbols-rounded text-sm text-amber-400"
            >zoom_in</i
          >
          Scroll to zoom</span
        >
      </div>
    </footer>

    <!-- Game Over Modal -->
    <div
      id="gameover-modal"
      class="fixed inset-0 z-30 flex items-center justify-center bg-black/65 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200"
    >
      <div
        class="md-bar rounded-3xl p-6 sm:p-8 max-w-md w-[90%] text-center border border-amber-400/30 shadow-2xl transform scale-95 transition-transform duration-200"
        id="gameover-card"
      >
        <div
          class="w-14 h-14 mx-auto mb-4 rounded-full bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-300"
        >
          <span class="material-symbols-rounded text-3xl">emoji_events</span>
        </div>
        <h2
          id="gameover-title"
          class="font-gothic text-2xl sm:text-3xl font-bold text-amber-100 mb-2"
        >
          CHECKMATE
        </h2>
        <p id="gameover-subtitle" class="text-sm text-slate-300 mb-6">
          Marble triumphs in the Gothic Sanctuary.
        </p>
        <button
          id="btn-modal-restart"
          class="md-chip w-full py-3 rounded-full font-semibold text-sm bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg"
        >
          Play Again
        </button>
      </div>
    </div>

    <script>
      /***********************************************************************
       * 1. ZERO-LATENCY WEB AUDIO API SYNTHESIZER (No heavy external library)
       ***********************************************************************/
      class FastSoundEngine {
        constructor() {
          this.enabled = true;
          this.ctx = null;
          this.noiseBuffer = null;
        }

        init() {
          if (this.ctx) {
            if (this.ctx.state === "suspended") this.ctx.resume();
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          // Pre-generate 0.5s brown/stone noise buffer once for zero-lag shatter sounds
          const sampleRate = this.ctx.sampleRate;
          const length = sampleRate * 0.5;
          this.noiseBuffer = this.ctx.createBuffer(1, length, sampleRate);
          const data = this.noiseBuffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < length; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.04 * white) / 1.04;
            lastOut = data[i];
            data[i] *= 3.0;
          }
        }

        playSelect() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        }

        playMove() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(115, now);
          osc.frequency.exponentialRampToValueAtTime(38, now + 0.18);

          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.21);
        }

        playAttackStrike() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(32, now + 0.24);

          gain.gain.setValueAtTime(0.38, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.27);
        }

        playShatter() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx || !this.noiseBuffer) return;

          const now = this.ctx.currentTime;
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(950, now);
          filter.Q.setValueAtTime(1.2, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.42);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + 0.45);
        }

        playCheck() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.14, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              now + idx * 0.06 + 0.45,
            );
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.46);
          });
        }
      }

      const soundFX = new FastSoundEngine();

      /***********************************************************************
       * 2. LIGHTWEIGHT PROCEDURAL TEXTURES (256x256, Generated Once)
       ***********************************************************************/
      function createStoneTexture(isMarble) {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = isMarble ? "#f2efe9" : "#15121d";
        ctx.fillRect(0, 0, 256, 256);

        // Mineral veining
        for (let v = 0; v < 14; v++) {
          ctx.beginPath();
          let x = Math.random() * 256;
          let y = Math.random() * 256;
          ctx.moveTo(x, y);
          for (let s = 0; s < 6; s++) {
            x += (Math.random() - 0.48) * 45;
            y += (Math.random() - 0.48) * 45;
            ctx.lineTo(x, y);
          }
          ctx.strokeStyle = isMarble
            ? v % 3 === 0
              ? "rgba(195, 165, 105, 0.4)"
              : "rgba(145, 140, 150, 0.3)"
            : v % 3 === 0
              ? "rgba(168, 115, 255, 0.35)"
              : "rgba(75, 65, 105, 0.4)";
          ctx.lineWidth = 1.2 + Math.random() * 1.5;
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      /***********************************************************************
       * 3. HIGH-PERFORMANCE SCENE, RENDERER & CACHED MATERIALS
       ***********************************************************************/
      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0a0f);
      scene.fog = new THREE.FogExp2(0x0b0a0f, 0.015);

      const camera = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.5,
        110,
      );
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
        stencil: false,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      // Strictly cap pixel ratio at 1.5 to prevent 4K/Retina GPU fill-rate lag
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap; // Faster than PCFSoftShadowMap
      container.appendChild(renderer.domElement);

      // Shared Materials (Created once, reused everywhere)
      const marbleTex = createStoneTexture(true);
      const obsidianTex = createStoneTexture(false);

      const MATERIALS = {
        marblePiece: new THREE.MeshStandardMaterial({
          map: marbleTex,
          color: 0xfaf7f2,
          roughness: 0.24,
          metalness: 0.08,
        }),
        obsidianPiece: new THREE.MeshStandardMaterial({
          map: obsidianTex,
          color: 0x1e192a,
          roughness: 0.16,
          metalness: 0.42,
        }),
        lightSquare: new THREE.MeshStandardMaterial({
          map: marbleTex,
          color: 0xdcd7ce,
          roughness: 0.32,
          metalness: 0.05,
        }),
        darkSquare: new THREE.MeshStandardMaterial({
          map: obsidianTex,
          color: 0x221e2d,
          roughness: 0.28,
          metalness: 0.25,
        }),
        goldTrim: new THREE.MeshStandardMaterial({
          color: 0xd4af37,
          roughness: 0.28,
          metalness: 0.82,
        }),
        darkStone: new THREE.MeshStandardMaterial({
          color: 0x191721,
          roughness: 0.82,
          metalness: 0.1,
        }),
        ribStone: new THREE.MeshStandardMaterial({
          color: 0x282436,
          roughness: 0.68,
          metalness: 0.15,
        }),
        selectedRing: new THREE.MeshBasicMaterial({
          color: 0xfbbf24,
          side: THREE.DoubleSide,
        }),
        hoverRing: new THREE.MeshBasicMaterial({
          color: 0xe2e8f0,
          transparent: true,
          opacity: 0.45,
          side: THREE.DoubleSide,
        }),
        moveDot: new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.85,
          side: THREE.DoubleSide,
        }),
        captureRing: new THREE.MeshBasicMaterial({
          color: 0xef4444,
          transparent: true,
          opacity: 0.9,
          side: THREE.DoubleSide,
        }),
      };

      /***********************************************************************
       * 4. OPTIMIZED LIGHTING (1 Shadow Directional + 1 Hemisphere + 1 Point)
       ***********************************************************************/
      function setupOptimizedLighting() {
        // 1. Ambient Cathedral Fill
        const hemiLight = new THREE.HemisphereLight(0xa78bfa, 0x1a1625, 0.75);
        scene.add(hemiLight);

        // 2. Single Shadow-Casting Directional Light (Tightly fitted to the 16x16 chessboard)
        const dirLight = new THREE.DirectionalLight(0xfff3da, 1.45);
        dirLight.position.set(10, 22, 12);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 8;
        dirLight.shadow.camera.far = 42;
        const d = 10.5;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.bias = -0.0008;
        scene.add(dirLight);

        // 3. Single Non-Shadow Warm Sanctuary PointLight for Golden Highlight
        const warmPoint = new THREE.PointLight(0xff9933, 0.85, 38, 1.5);
        warmPoint.position.set(-10, 10, -10);
        warmPoint.castShadow = false;
        scene.add(warmPoint);
      }

      setupOptimizedLighting();

      /***********************************************************************
       * 5. INSTANCED GOTHIC CATHEDRAL ARCHITECTURE (Minimal Draw Calls)
       ***********************************************************************/
      const dummyMatrix = new THREE.Object3D();

      function buildInstancedGothicCathedral() {
        const cathedralGroup = new THREE.Group();

        // 1. Sanctuary Floor & Altar Pedestal
        const floorMesh = new THREE.Mesh(
          new THREE.CylinderGeometry(44, 44, 0.8, 24),
          MATERIALS.darkStone,
        );
        floorMesh.position.y = -1.5;
        cathedralGroup.add(floorMesh);

        const plinthMesh = new THREE.Mesh(
          new THREE.BoxGeometry(18.4, 1.6, 18.4),
          MATERIALS.ribStone,
        );
        plinthMesh.position.y = -0.95;
        plinthMesh.receiveShadow = true;
        cathedralGroup.add(plinthMesh);

        const trimMesh = new THREE.Mesh(
          new THREE.BoxGeometry(16.8, 0.2, 16.8),
          MATERIALS.goldTrim,
        );
        trimMesh.position.y = -0.14;
        cathedralGroup.add(trimMesh);

        // 2. Instanced Gothic Columns (12 Pillars in 2 draw calls)
        const pillarCoords = [
          [-16, -16],
          [-16, -6],
          [-16, 6],
          [-16, 16],
          [16, -16],
          [16, -6],
          [16, 6],
          [16, 16],
          [-6, -22],
          [6, -22],
          [-6, 22],
          [6, 22],
        ];

        const shaftGeo = new THREE.CylinderGeometry(1.0, 1.15, 23, 10);
        const baseCapGeo = new THREE.CylinderGeometry(1.5, 1.6, 1.5, 8);

        const instancedShafts = new THREE.InstancedMesh(
          shaftGeo,
          MATERIALS.darkStone,
          pillarCoords.length,
        );
        const instancedBases = new THREE.InstancedMesh(
          baseCapGeo,
          MATERIALS.ribStone,
          pillarCoords.length * 2,
        );

        pillarCoords.forEach(([px, pz], idx) => {
          dummyMatrix.position.set(px, 10.5, pz);
          dummyMatrix.rotation.set(0, 0, 0);
          dummyMatrix.scale.set(1, 1, 1);
          dummyMatrix.updateMatrix();
          instancedShafts.setMatrixAt(idx, dummyMatrix.matrix);

          // Base
          dummyMatrix.position.set(px, -0.35, pz);
          dummyMatrix.updateMatrix();
          instancedBases.setMatrixAt(idx * 2, dummyMatrix.matrix);

          // Capital
          dummyMatrix.position.set(px, 21.8, pz);
          dummyMatrix.updateMatrix();
          instancedBases.setMatrixAt(idx * 2 + 1, dummyMatrix.matrix);
        });

        cathedralGroup.add(instancedShafts);
        cathedralGroup.add(instancedBases);

        // 3. Instanced Pointed Gothic Vault Arches (8 half-ribs in 1 draw call)
        const archZ = [-16, -6, 6, 16];
        const archGeo = new THREE.TorusGeometry(
          17.5,
          0.35,
          6,
          20,
          Math.PI / 2.6,
        );
        const instancedArches = new THREE.InstancedMesh(
          archGeo,
          MATERIALS.ribStone,
          archZ.length * 2,
        );

        archZ.forEach((zPos, i) => {
          // Left rib
          dummyMatrix.position.set(-2, 21.5, zPos);
          dummyMatrix.rotation.set(0, 0, 0);
          dummyMatrix.updateMatrix();
          instancedArches.setMatrixAt(i * 2, dummyMatrix.matrix);

          // Right rib
          dummyMatrix.position.set(2, 21.5, zPos);
          dummyMatrix.rotation.set(0, Math.PI, 0);
          dummyMatrix.updateMatrix();
          instancedArches.setMatrixAt(i * 2 + 1, dummyMatrix.matrix);
        });
        cathedralGroup.add(instancedArches);

        // 4. Minimalist Stained-Glass Rose Windows (North & South)
        const roseGroup = new THREE.Group();
        roseGroup.position.set(0, 14, -27);

        const outerRing = new THREE.Mesh(
          new THREE.TorusGeometry(6.0, 0.5, 8, 24),
          MATERIALS.ribStone,
        );
        roseGroup.add(outerRing);

        const coreGlow = new THREE.Mesh(
          new THREE.CircleGeometry(5.6, 24),
          new THREE.MeshBasicMaterial({
            color: 0x3b1d6e,
            side: THREE.DoubleSide,
          }),
        );
        coreGlow.position.z = -0.15;
        roseGroup.add(coreGlow);

        const innerSun = new THREE.Mesh(
          new THREE.CircleGeometry(2.1, 16),
          new THREE.MeshBasicMaterial({
            color: 0xf59e0b,
            side: THREE.DoubleSide,
          }),
        );
        innerSun.position.z = -0.1;
        roseGroup.add(innerSun);

        const petalGeo = new THREE.CircleGeometry(1.0, 12);
        const petalMat = new THREE.MeshBasicMaterial({
          color: 0xa855f7,
          side: THREE.DoubleSide,
        });
        const petalInst = new THREE.InstancedMesh(petalGeo, petalMat, 12);
        for (let i = 0; i < 12; i++) {
          const a = (i * Math.PI) / 6;
          dummyMatrix.position.set(Math.cos(a) * 3.9, Math.sin(a) * 3.9, -0.08);
          dummyMatrix.rotation.set(0, 0, 0);
          dummyMatrix.updateMatrix();
          petalInst.setMatrixAt(i, dummyMatrix.matrix);
        }
        roseGroup.add(petalInst);

        const southRose = roseGroup.clone();
        southRose.position.set(0, 14, 27);
        cathedralGroup.add(roseGroup);
        cathedralGroup.add(southRose);

        // 5. Single Points Buffer for Floating Cathedral Dust Motes
        const particleCount = 140;
        const pGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 30;
          positions[i * 3 + 1] = 0.5 + Math.random() * 15;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 30;
        }
        pGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const pMat = new THREE.PointsMaterial({
          color: 0xfde68a,
          size: 0.14,
          transparent: true,
          opacity: 0.45,
        });
        const dustParticles = new THREE.Points(pGeo, pMat);
        dustParticles.name = "cathedralDust";
        cathedralGroup.add(dustParticles);

        scene.add(cathedralGroup);
      }

      buildInstancedGothicCathedral();

      /***********************************************************************
       * 6. INSTANCED 64-SQUARE BOARD (2 Draw Calls Total) & CACHED GEOMETRIES
       ***********************************************************************/
      const SQUARE_SIZE = 2.0;
      const BOARD_OFFSET = 3.5 * SQUARE_SIZE;

      const boardGroup = new THREE.Group();
      scene.add(boardGroup);

      function algebraicToWorld(square) {
        const file = square.charCodeAt(0) - 97;
        const rank = parseInt(square[1], 10) - 1;
        const x = file * SQUARE_SIZE - BOARD_OFFSET;
        const z = (7 - rank) * SQUARE_SIZE - BOARD_OFFSET;
        return new THREE.Vector3(x, 0, z);
      }

      function worldToAlgebraic(x, z) {
        const file = Math.floor((x + 4 * SQUARE_SIZE) / SQUARE_SIZE);
        const rankFromTop = Math.floor((z + 4 * SQUARE_SIZE) / SQUARE_SIZE);
        if (file < 0 || file > 7 || rankFromTop < 0 || rankFromTop > 7)
          return null;
        const rank = 7 - rankFromTop;
        const files = ["a", "b", "c", "d", "e", "f", "g", "h"];
        return `${files[file]}${rank + 1}`;
      }

      function buildInstancedChessboard() {
        const tileGeo = new THREE.BoxGeometry(
          SQUARE_SIZE * 0.98,
          0.26,
          SQUARE_SIZE * 0.98,
        );
        const lightInst = new THREE.InstancedMesh(
          tileGeo,
          MATERIALS.lightSquare,
          32,
        );
        const darkInst = new THREE.InstancedMesh(
          tileGeo,
          MATERIALS.darkSquare,
          32,
        );
        lightInst.receiveShadow = true;
        darkInst.receiveShadow = true;

        let lIdx = 0,
          dIdx = 0;
        const files = ["a", "b", "c", "d", "e", "f", "g", "h"];

        for (let f = 0; f < 8; f++) {
          for (let r = 0; r < 8; r++) {
            const isLight = (f + r) % 2 !== 0;
            const sqName = `${files[f]}${r + 1}`;
            const pos = algebraicToWorld(sqName);
            dummyMatrix.position.set(pos.x, -0.13, pos.z);
            dummyMatrix.rotation.set(0, 0, 0);
            dummyMatrix.scale.set(1, 1, 1);
            dummyMatrix.updateMatrix();

            if (isLight) {
              lightInst.setMatrixAt(lIdx++, dummyMatrix.matrix);
            } else {
              darkInst.setMatrixAt(dIdx++, dummyMatrix.matrix);
            }
          }
        }
        boardGroup.add(lightInst);
        boardGroup.add(darkInst);
      }

      buildInstancedChessboard();

      // Hover & Selection Indicator Meshes (Created once, toggled via .visible)
      const hoverQuadGeo = new THREE.RingGeometry(0.72, 0.88, 24);
      hoverQuadGeo.rotateX(-Math.PI / 2);
      const hoverMarker = new THREE.Mesh(hoverQuadGeo, MATERIALS.hoverRing);
      hoverMarker.position.y = 0.025;
      hoverMarker.visible = false;
      boardGroup.add(hoverMarker);

      const selectedMarker = new THREE.Mesh(
        hoverQuadGeo,
        MATERIALS.selectedRing,
      );
      selectedMarker.position.y = 0.03;
      selectedMarker.visible = false;
      boardGroup.add(selectedMarker);

      // Pre-allocate Legal Move Marker Pool (max 28 moves in chess)
      const moveDotGeo = new THREE.CircleGeometry(0.32, 16);
      moveDotGeo.rotateX(-Math.PI / 2);
      const captureRingGeo = new THREE.RingGeometry(0.65, 0.88, 20);
      captureRingGeo.rotateX(-Math.PI / 2);

      const moveMarkerPool = [];
      for (let i = 0; i < 32; i++) {
        const m = new THREE.Mesh(moveDotGeo, MATERIALS.moveDot);
        m.position.y = 0.03;
        m.visible = false;
        boardGroup.add(m);
        moveMarkerPool.push(m);
      }

      // Pre-build & Cache Low-Poly Geometries for all 6 Chess Piece Types (12-16 segments)
      const GEOM_CACHE = (() => {
        const basePoints = [
          new THREE.Vector2(0, 0),
          new THREE.Vector2(0.72, 0),
          new THREE.Vector2(0.72, 0.14),
          new THREE.Vector2(0.56, 0.28),
          new THREE.Vector2(0.6, 0.36),
          new THREE.Vector2(0.45, 0.5),
        ];
        return {
          base: new THREE.LatheGeometry(basePoints, 14),
          collar: new THREE.TorusGeometry(0.46, 0.04, 8, 16),
          // Pawn
          pawnBody: new THREE.CylinderGeometry(0.25, 0.43, 0.85, 12),
          pawnHead: new THREE.SphereGeometry(0.33, 14, 12),
          pawnSpire: new THREE.ConeGeometry(0.11, 0.24, 8),
          // Rook
          rookTower: new THREE.CylinderGeometry(0.44, 0.51, 1.35, 12),
          rookParapet: new THREE.CylinderGeometry(0.55, 0.45, 0.3, 12),
          rookCrenel: new THREE.BoxGeometry(0.18, 0.24, 0.18),
          // Knight
          knightTorso: new THREE.CylinderGeometry(0.34, 0.47, 0.95, 12),
          knightNeck: new THREE.BoxGeometry(0.38, 0.95, 0.55),
          knightSnout: new THREE.ConeGeometry(0.27, 0.7, 4),
          knightMane: new THREE.BoxGeometry(0.12, 0.84, 0.2),
          // Bishop
          bishopCol: new THREE.CylinderGeometry(0.28, 0.44, 1.35, 14),
          bishopMitre: new THREE.SphereGeometry(0.37, 14, 12),
          bishopJewel: new THREE.OctahedronGeometry(0.14, 0),
          // Queen
          queenGown: new THREE.CylinderGeometry(0.28, 0.47, 1.65, 14),
          queenDome: new THREE.SphereGeometry(0.35, 14, 12),
          queenSpike: new THREE.ConeGeometry(0.07, 0.34, 6),
          // King
          kingRobe: new THREE.CylinderGeometry(0.33, 0.49, 1.85, 14),
          kingCrown: new THREE.CylinderGeometry(0.43, 0.32, 0.42, 8),
          kingCrossV: new THREE.BoxGeometry(0.14, 0.5, 0.14),
          kingCrossH: new THREE.BoxGeometry(0.38, 0.14, 0.14),
        };
      })();

      // Assemble Piece Mesh using cached geometries
      function createPieceMesh(type, color) {
        const group = new THREE.Group();
        const mat =
          color === "w" ? MATERIALS.marblePiece : MATERIALS.obsidianPiece;

        const baseMesh = new THREE.Mesh(GEOM_CACHE.base, mat);
        baseMesh.castShadow = true;
        baseMesh.receiveShadow = true;
        group.add(baseMesh);

        const collar = new THREE.Mesh(GEOM_CACHE.collar, MATERIALS.goldTrim);
        collar.rotation.x = Math.PI / 2;
        collar.position.y = 0.48;
        group.add(collar);

        if (type === "p") {
          const body = new THREE.Mesh(GEOM_CACHE.pawnBody, mat);
          body.position.y = 0.9;
          body.castShadow = true;
          group.add(body);

          const head = new THREE.Mesh(GEOM_CACHE.pawnHead, mat);
          head.position.y = 1.5;
          head.castShadow = true;
          group.add(head);

          const spire = new THREE.Mesh(
            GEOM_CACHE.pawnSpire,
            MATERIALS.goldTrim,
          );
          spire.position.y = 1.9;
          group.add(spire);
        } else if (type === "r") {
          const tower = new THREE.Mesh(GEOM_CACHE.rookTower, mat);
          tower.position.y = 1.15;
          tower.castShadow = true;
          group.add(tower);

          const parapet = new THREE.Mesh(GEOM_CACHE.rookParapet, mat);
          parapet.position.y = 1.92;
          parapet.castShadow = true;
          group.add(parapet);

          for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3;
            const crenel = new THREE.Mesh(GEOM_CACHE.rookCrenel, mat);
            crenel.position.set(Math.cos(a) * 0.41, 2.14, Math.sin(a) * 0.41);
            crenel.rotation.y = -a;
            group.add(crenel);
          }
        } else if (type === "n") {
          const torso = new THREE.Mesh(GEOM_CACHE.knightTorso, mat);
          torso.position.y = 0.95;
          torso.castShadow = true;
          group.add(torso);

          const neck = new THREE.Mesh(GEOM_CACHE.knightNeck, mat);
          neck.position.set(0, 1.65, 0.06);
          neck.rotation.x = 0.28;
          neck.castShadow = true;
          group.add(neck);

          const snout = new THREE.Mesh(GEOM_CACHE.knightSnout, mat);
          snout.rotation.x = Math.PI / 2 + 0.35;
          snout.rotation.y = Math.PI / 4;
          snout.position.set(0, 1.95, 0.42);
          group.add(snout);

          const mane = new THREE.Mesh(
            GEOM_CACHE.knightMane,
            MATERIALS.goldTrim,
          );
          mane.position.set(0, 1.72, -0.2);
          mane.rotation.x = 0.25;
          group.add(mane);

          group.rotation.y = color === "w" ? Math.PI : 0;
        } else if (type === "b") {
          const column = new THREE.Mesh(GEOM_CACHE.bishopCol, mat);
          column.position.y = 1.15;
          column.castShadow = true;
          group.add(column);

          const mitre = new THREE.Mesh(GEOM_CACHE.bishopMitre, mat);
          mitre.scale.set(1, 1.55, 0.85);
          mitre.position.y = 2.05;
          mitre.castShadow = true;
          group.add(mitre);

          const jewel = new THREE.Mesh(
            GEOM_CACHE.bishopJewel,
            MATERIALS.goldTrim,
          );
          jewel.position.y = 2.72;
          group.add(jewel);
        } else if (type === "q") {
          const gown = new THREE.Mesh(GEOM_CACHE.queenGown, mat);
          gown.position.y = 1.3;
          gown.castShadow = true;
          group.add(gown);

          const dome = new THREE.Mesh(GEOM_CACHE.queenDome, mat);
          dome.position.y = 2.25;
          dome.castShadow = true;
          group.add(dome);

          for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI) / 4;
            const spike = new THREE.Mesh(
              GEOM_CACHE.queenSpike,
              MATERIALS.goldTrim,
            );
            spike.position.set(Math.cos(a) * 0.3, 2.55, Math.sin(a) * 0.3);
            spike.rotation.z = -Math.cos(a) * 0.25;
            spike.rotation.x = Math.sin(a) * 0.25;
            group.add(spike);
          }
        } else if (type === "k") {
          const robe = new THREE.Mesh(GEOM_CACHE.kingRobe, mat);
          robe.position.y = 1.4;
          robe.castShadow = true;
          group.add(robe);

          const crown = new THREE.Mesh(GEOM_CACHE.kingCrown, mat);
          crown.position.y = 2.45;
          crown.castShadow = true;
          group.add(crown);

          const crossV = new THREE.Mesh(
            GEOM_CACHE.kingCrossV,
            MATERIALS.goldTrim,
          );
          crossV.position.y = 2.92;
          group.add(crossV);

          const crossH = new THREE.Mesh(
            GEOM_CACHE.kingCrossH,
            MATERIALS.goldTrim,
          );
          crossH.position.y = 2.96;
          group.add(crossH);
        }

        return group;
      }

      /***********************************************************************
       * 7. PRE-ALLOCATED SHATTER FRAGMENT POOL (Zero Runtime Allocation/GC)
       ***********************************************************************/
      const SHARD_POOL_SIZE = 32;
      const sharedShardGeo = new THREE.DodecahedronGeometry(0.18, 0);
      const shardPool = [];

      for (let i = 0; i < SHARD_POOL_SIZE; i++) {
        const mesh = new THREE.Mesh(sharedShardGeo, MATERIALS.obsidianPiece);
        mesh.visible = false;
        scene.add(mesh);
        shardPool.push({
          mesh,
          vel: new THREE.Vector3(),
          rotVel: new THREE.Vector3(),
          life: 0,
          active: false,
        });
      }

      function triggerShatterExplosion(worldPos, color) {
        soundFX.playShatter();
        const mat =
          color === "w" ? MATERIALS.marblePiece : MATERIALS.obsidianPiece;

        for (let i = 0; i < SHARD_POOL_SIZE; i++) {
          const frag = shardPool[i];
          frag.active = true;
          frag.life = 1.0;
          frag.mesh.material = i % 7 === 0 ? MATERIALS.goldTrim : mat;
          frag.mesh.visible = true;

          const scale = 0.65 + Math.random() * 0.75;
          frag.mesh.scale.setScalar(scale);
          frag.mesh.position.set(
            worldPos.x + (Math.random() - 0.5) * 0.6,
            0.35 + Math.random() * 1.5,
            worldPos.z + (Math.random() - 0.5) * 0.6,
          );

          const angle = Math.random() * Math.PI * 2;
          const speed = 2.4 + Math.random() * 5.2;
          frag.vel.set(
            Math.cos(angle) * speed,
            3.0 + Math.random() * 4.2,
            Math.sin(angle) * speed,
          );
          frag.rotVel.set(
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10,
          );
        }
      }

      /***********************************************************************
       * 8. GAMEPLAY ENGINE & ANIMATION CONTROLLERS
       ***********************************************************************/
      const piecesGroup = new THREE.Group();
      scene.add(piecesGroup);

      const activePieceMeshes = {};
      let currentMoveAnimation = null;

      const game = new Chess();
      let selectedSquare = null;
      let legalMovesForSelected = [];
      let vsAI = true;
      let isAnimating = false;

      const pieceNames = {
        p: "Pawn",
        r: "Rook",
        n: "Knight",
        b: "Bishop",
        q: "Queen",
        k: "King",
      };

      function syncFullBoardFromState() {
        Object.values(activePieceMeshes).forEach((p) =>
          piecesGroup.remove(p.mesh),
        );
        for (const k in activePieceMeshes) delete activePieceMeshes[k];

        const files = ["a", "b", "c", "d", "e", "f", "g", "h"];
        const board = game.board();

        for (let r = 0; r < 8; r++) {
          for (let f = 0; f < 8; f++) {
            const piece = board[r][f];
            if (piece) {
              const sq = `${files[f]}${8 - r}`;
              const mesh = createPieceMesh(piece.type, piece.color);
              const worldPos = algebraicToWorld(sq);
              mesh.position.copy(worldPos);
              piecesGroup.add(mesh);

              activePieceMeshes[sq] = {
                mesh,
                type: piece.type,
                color: piece.color,
                basePos: worldPos.clone(),
                idlePhase: Math.random() * Math.PI * 2,
              };
            }
          }
        }
        updateHUDStatus();
      }

      function clearSquareHighlights() {
        selectedMarker.visible = false;
        for (let i = 0; i < moveMarkerPool.length; i++) {
          moveMarkerPool[i].visible = false;
        }
      }

      function highlightSelectedAndLegal(square, moves) {
        clearSquareHighlights();
        if (!square) return;

        const selPos = algebraicToWorld(square);
        selectedMarker.position.set(selPos.x, 0.03, selPos.z);
        selectedMarker.visible = true;

        moves.forEach((m, idx) => {
          if (idx >= moveMarkerPool.length) return;
          const marker = moveMarkerPool[idx];
          const pos = algebraicToWorld(m.to);
          const isCapture = m.flags.includes("c") || m.flags.includes("e");

          marker.geometry = isCapture ? captureRingGeo : moveDotGeo;
          marker.material = isCapture
            ? MATERIALS.captureRing
            : MATERIALS.moveDot;
          marker.position.set(pos.x, 0.03, pos.z);
          marker.visible = true;
        });
      }

      function showCombatBanner(text) {
        const banner = document.getElementById("combat-banner");
        banner.textContent = text;
        banner.classList.remove("opacity-0", "translate-y-2");
        banner.classList.add("opacity-100", "translate-y-0");
        clearTimeout(banner._hideTimer);
        banner._hideTimer = setTimeout(() => {
          banner.classList.remove("opacity-100", "translate-y-0");
          banner.classList.add("opacity-0", "translate-y-2");
        }, 2400);
      }

      function executeAnimatedMove(moveObj) {
        isAnimating = true;
        clearSquareHighlights();
        selectedSquare = null;
        legalMovesForSelected = [];

        const fromSq = moveObj.from;
        const toSq = moveObj.to;
        const attacker = activePieceMeshes[fromSq];
        let defender = activePieceMeshes[toSq];

        let enPassantSq = null;
        if (moveObj.flags.includes("e")) {
          const file = toSq[0];
          const rank =
            moveObj.color === "w"
              ? parseInt(toSq[1], 10) - 1
              : parseInt(toSq[1], 10) + 1;
          enPassantSq = `${file}${rank}`;
          defender = activePieceMeshes[enPassantSq];
        }

        let rookCastleAnim = null;
        if (moveObj.flags.includes("k") || moveObj.flags.includes("q")) {
          const rank = moveObj.color === "w" ? "1" : "8";
          const rookFrom = moveObj.flags.includes("k")
            ? `h${rank}`
            : `a${rank}`;
          const rookTo = moveObj.flags.includes("k") ? `f${rank}` : `d${rank}`;
          const rookObj = activePieceMeshes[rookFrom];
          if (rookObj) {
            rookCastleAnim = {
              piece: rookObj,
              fromSq: rookFrom,
              toSq: rookTo,
              startPos: rookObj.basePos.clone(),
              endPos: algebraicToWorld(rookTo),
            };
          }
        }

        const startPos = attacker.basePos.clone();
        const endPos = algebraicToWorld(toSq);
        const isCapture = Boolean(defender);

        if (isCapture) {
          const atkName = `${attacker.color === "w" ? "Marble" : "Obsidian"} ${pieceNames[attacker.type]}`;
          const defName = `${defender.color === "w" ? "Marble" : "Obsidian"} ${pieceNames[defender.type]}`;
          showCombatBanner(`${atkName} shatters ${defName}!`);
        } else {
          soundFX.playMove();
        }

        currentMoveAnimation = {
          attacker,
          defender,
          fromSq,
          toSq,
          enPassantSq,
          startPos,
          endPos,
          approachTarget: new THREE.Vector3().lerpVectors(
            startPos,
            endPos,
            0.82,
          ),
          isCapture,
          shattered: false,
          moveObj,
          rookCastleAnim,
          elapsed: 0,
          duration: isCapture ? 0.85 : 0.48,
        };
      }

      function finalizeAnimatedMove(anim) {
        const {
          attacker,
          defender,
          fromSq,
          toSq,
          enPassantSq,
          endPos,
          moveObj,
          rookCastleAnim,
        } = anim;

        if (defender) {
          piecesGroup.remove(defender.mesh);
          delete activePieceMeshes[enPassantSq || toSq];
        }

        delete activePieceMeshes[fromSq];
        attacker.mesh.position.copy(endPos);
        attacker.mesh.rotation.x = 0;
        attacker.mesh.rotation.z = 0;
        attacker.basePos.copy(endPos);

        if (moveObj.flags.includes("p")) {
          piecesGroup.remove(attacker.mesh);
          const promotedMesh = createPieceMesh(
            moveObj.promotion || "q",
            attacker.color,
          );
          promotedMesh.position.copy(endPos);
          piecesGroup.add(promotedMesh);
          attacker.mesh = promotedMesh;
          attacker.type = moveObj.promotion || "q";
          showCombatBanner("Pawn ascends to Queen!");
        }

        activePieceMeshes[toSq] = attacker;

        if (rookCastleAnim) {
          delete activePieceMeshes[rookCastleAnim.fromSq];
          rookCastleAnim.piece.mesh.position.copy(rookCastleAnim.endPos);
          rookCastleAnim.piece.basePos.copy(rookCastleAnim.endPos);
          activePieceMeshes[rookCastleAnim.toSq] = rookCastleAnim.piece;
        }

        isAnimating = false;
        currentMoveAnimation = null;

        if (game.in_check()) {
          soundFX.playCheck();
        }

        updateHUDStatus();

        if (!game.game_over() && vsAI && game.turn() === "b") {
          setTimeout(scheduleWizardAIMove, 180);
        }
      }

      /***********************************************************************
       * 9. NON-BLOCKING ALPHA-BETA PRUNING WIZARD AI (Piece-Square Tables)
       ***********************************************************************/
      const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

      // Simplified Positional Bonus Table (encourages center control & development)
      const CENTER_BONUS = [
        [0, 0, 0, 0, 0, 0, 0, 0],
        [5, 10, 10, 10, 10, 10, 10, 5],
        [4, 8, 16, 20, 20, 16, 8, 4],
        [5, 10, 20, 28, 28, 20, 10, 5],
        [5, 10, 20, 28, 28, 20, 10, 5],
        [4, 8, 16, 20, 20, 16, 8, 4],
        [5, 10, 10, 10, 10, 10, 10, 5],
        [0, 0, 0, 0, 0, 0, 0, 0],
      ];

      function evaluateBoardFast(chess) {
        if (chess.in_checkmate()) {
          return chess.turn() === "w" ? 99999 : -99999;
        }
        if (chess.in_draw()) return 0;

        const board = chess.board();
        let score = 0;
        for (let r = 0; r < 8; r++) {
          for (let f = 0; f < 8; f++) {
            const p = board[r][f];
            if (p) {
              const val =
                PIECE_VALUES[p.type] +
                (p.type !== "k" ? CENTER_BONUS[r][f] : 0);
              score += p.color === "b" ? val : -val;
            }
          }
        }
        return score;
      }

      function alphaBeta(chess, depth, alpha, beta, isMaximizing) {
        if (depth === 0 || chess.game_over()) {
          return evaluateBoardFast(chess);
        }
        const moves = chess.moves({ verbose: true });
        // Move ordering: captures first for rapid Alpha-Beta cutoffs
        moves.sort(
          (a, b) =>
            (b.flags.includes("c") ? 1 : 0) - (a.flags.includes("c") ? 1 : 0),
        );

        if (isMaximizing) {
          let maxEval = -Infinity;
          for (let i = 0; i < moves.length; i++) {
            chess.move(moves[i]);
            const evaluation = alphaBeta(chess, depth - 1, alpha, beta, false);
            chess.undo();
            if (evaluation > maxEval) maxEval = evaluation;
            if (evaluation > alpha) alpha = evaluation;
            if (beta <= alpha) break;
          }
          return maxEval;
        } else {
          let minEval = Infinity;
          for (let i = 0; i < moves.length; i++) {
            chess.move(moves[i]);
            const evaluation = alphaBeta(chess, depth - 1, alpha, beta, true);
            chess.undo();
            if (evaluation < minEval) minEval = evaluation;
            if (evaluation < beta) beta = evaluation;
            if (beta <= alpha) break;
          }
          return minEval;
        }
      }

      function scheduleWizardAIMove() {
        if (game.game_over() || isAnimating) return;
        // Run asynchronously after next paint so UI & 60 FPS animations never stutter
        requestAnimationFrame(() => {
          setTimeout(() => {
            if (game.game_over() || isAnimating) return;
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            // Shuffle slightly before ordering captures
            moves.sort(() => Math.random() - 0.5);
            moves.sort(
              (a, b) =>
                (b.flags.includes("c") ? 1 : 0) -
                (a.flags.includes("c") ? 1 : 0),
            );

            let bestMove = moves[0];
            let bestScore = -Infinity;
            let alpha = -Infinity;
            const beta = Infinity;

            for (let i = 0; i < moves.length; i++) {
              const m = moves[i];
              game.move(m);
              const score =
                alphaBeta(game, 1, alpha, beta, false) +
                (m.flags.includes("c") ? 18 : 0);
              game.undo();

              if (score > bestScore) {
                bestScore = score;
                bestMove = m;
              }
              if (score > alpha) alpha = score;
            }

            const executed = game.move(bestMove);
            if (executed) {
              executeAnimatedMove(executed);
            }
          }, 20);
        });
      }

      /***********************************************************************
       * 10. O(1) MATHEMATICAL BOARD PLANE INTERSECTION & CAMERA ORBIT
       ***********************************************************************/
      const cameraState = {
        theta: 0,
        phi: 0.9,
        radius: 23.0,
        targetTheta: 0,
        targetPhi: 0.9,
        targetRadius: 23.0,
        minRadius: 13.0, // Lower = Zoom IN closer (was 13)
        maxRadius: 55.0, // Higher = Zoom OUT farther (was 35)
        pinchSpeed: 0.08, // Higher = Faster two-finger zoom (was 0.05)
        presetIndex: 0,
      };

      const cameraPresets = [
        { name: "White View", theta: 0, phi: 0.9, radius: 23.0 },
        { name: "Black View", theta: Math.PI, phi: 0.9, radius: 23.0 },
        {
          name: "Sanctuary Nave",
          theta: -Math.PI / 4,
          phi: 1.02,
          radius: 26.0,
        },
        { name: "Top Altar", theta: 0, phi: 0.22, radius: 24.5 },
      ];

      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      // Mathematical horizontal plane at y = 0.25 (Zero scene-graph traversal cost!)
      const mathematicalBoardPlane = new THREE.Plane(
        new THREE.Vector3(0, 1, 0),
        -0.25,
      );
      const planeHitPoint = new THREE.Vector3();

      //// Steppsss
      let isPointerDown = false;
      let pointerMoved = false;
      let pointerStart = { x: 0, y: 0 };
      let initialPinchDistance = null;

      function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
      }

      function getSquareFromClientCoords(clientX, clientY) {
        pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        const hit = raycaster.ray.intersectPlane(
          mathematicalBoardPlane,
          planeHitPoint,
        );
        if (!hit) return null;
        return worldToAlgebraic(planeHitPoint.x, planeHitPoint.z);
      }

      function handleSquareSelection(sq) {
        if (isAnimating || game.game_over()) return;
        if (vsAI && game.turn() === "b") return;

        const chosenMove = legalMovesForSelected.find((m) => m.to === sq);
        if (selectedSquare && chosenMove) {
          const moveResult = game.move({
            from: selectedSquare,
            to: sq,
            promotion: "q",
          });
          if (moveResult) {
            executeAnimatedMove(moveResult);
          }
          return;
        }

        const pieceOnSq = game.get(sq);
        if (pieceOnSq && pieceOnSq.color === game.turn()) {
          selectedSquare = sq;
          legalMovesForSelected = game.moves({ square: sq, verbose: true });
          soundFX.playSelect();
          highlightSelectedAndLegal(sq, legalMovesForSelected);
        } else {
          selectedSquare = null;
          legalMovesForSelected = [];
          clearSquareHighlights();
        }
      }

      function onPointerDown(e) {
        if (e.target !== renderer.domElement) return;

        // Detect two-finger pinch start on mobile
        if (e.touches && e.touches.length === 2) {
          isPointerDown = false;
          pointerMoved = true;
          initialPinchDistance = getTouchDistance(e.touches);
          hoverMarker.visible = false;
          return;
        }

        isPointerDown = true;
        pointerMoved = false;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        pointerStart.x = clientX;
        pointerStart.y = clientY;
      }

      function onPointerMove(e) {
        // Handle two-finger pinch zoom on mobile
        if (e.touches && e.touches.length === 2) {
          const currentDist = getTouchDistance(e.touches);
          if (initialPinchDistance !== null) {
            const delta = initialPinchDistance - currentDist;
            cameraState.targetRadius = Math.max(
              cameraState.minRadius,
              Math.min(
                cameraState.maxRadius,
                cameraState.targetRadius + delta * cameraState.pinchSpeed,
              ),
            );
          }
          initialPinchDistance = currentDist;
          pointerMoved = true;
          return;
        }

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (isPointerDown) {
          const dx = clientX - pointerStart.x;
          const dy = clientY - pointerStart.y;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
            pointerMoved = true;
          }
          if (pointerMoved) {
            cameraState.targetTheta -= dx * 0.0065;
            cameraState.targetPhi = Math.max(
              0.18,
              Math.min(1.38, cameraState.targetPhi - dy * 0.0055),
            );
            pointerStart.x = clientX;
            pointerStart.y = clientY;
            hoverMarker.visible = false;
          }
          return;
        }

        // O(1) Mathematical Hover Computation (No Mesh Raycasting!)
        if (!e.touches && !isAnimating) {
          const hoveredSq = getSquareFromClientCoords(clientX, clientY);
          if (hoveredSq) {
            const pos = algebraicToWorld(hoveredSq);
            hoverMarker.position.set(pos.x, 0.025, pos.z);
            hoverMarker.visible = true;
          } else {
            hoverMarker.visible = false;
          }
        }
      }

      function onPointerUp(e) {
        if (e.touches && e.touches.length < 2) {
          initialPinchDistance = null;
        }

        // If one finger remains on screen after lifting the second finger, re-anchor orbit start
        if (e.touches && e.touches.length === 1) {
          pointerStart.x = e.touches[0].clientX;
          pointerStart.y = e.touches[0].clientY;
          isPointerDown = true;
          pointerMoved = true;
          return;
        }

        if (!isPointerDown) return;
        isPointerDown = false;

        if (!pointerMoved) {
          const clientX = e.changedTouches
            ? e.changedTouches[0].clientX
            : e.clientX;
          const clientY = e.changedTouches
            ? e.changedTouches[0].clientY
            : e.clientY;
          const sq = getSquareFromClientCoords(clientX, clientY);
          if (sq) {
            handleSquareSelection(sq);
          } else {
            selectedSquare = null;
            legalMovesForSelected = [];
            clearSquareHighlights();
          }
        }
      }

      renderer.domElement.addEventListener("mousedown", onPointerDown);
      window.addEventListener("mousemove", onPointerMove, { passive: true });
      window.addEventListener("mouseup", onPointerUp);

      renderer.domElement.addEventListener("touchstart", onPointerDown, {
        passive: true,
      });
      window.addEventListener("touchmove", onPointerMove, { passive: true });
      window.addEventListener("touchend", onPointerUp);
      window.addEventListener("touchcancel", onPointerUp);

      renderer.domElement.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          cameraState.targetRadius = Math.max(
            cameraState.minRadius,
            Math.min(
              cameraState.maxRadius,
              cameraState.targetRadius + e.deltaY * 0.02,
            ),
          );
        },
        { passive: false },
      );
      /***********************************************************************
       * 11. UI CONTROLS & HUD STATUS
       ***********************************************************************/
      function updateHUDStatus() {
        const turn = game.turn();
        const turnDot = document.getElementById("turn-dot");
        const statusText = document.getElementById("status-text");
        const statusPill = document.getElementById("status-pill");
        const capturedSummary = document.getElementById("captured-summary");

        let whiteCount = 0,
          blackCount = 0;
        const board = game.board();
        for (let r = 0; r < 8; r++) {
          for (let f = 0; f < 8; f++) {
            const p = board[r][f];
            if (p) {
              if (p.color === "w") whiteCount++;
              else blackCount++;
            }
          }
        }
        capturedSummary.textContent = `Shattered: ${16 - blackCount} - ${16 - whiteCount}`;

        if (turn === "w") {
          turnDot.className =
            "w-3 h-3 rounded-full bg-stone-100 shadow-[0_0_8px_rgba(255,255,255,0.9)]";
        } else {
          turnDot.className =
            "w-3 h-3 rounded-full bg-purple-950 border border-purple-400 shadow-[0_0_8px_rgba(168,85,247,0.85)]";
        }

        statusPill.classList.remove("check-pulse", "border-red-500/70");

        if (game.in_checkmate()) {
          const winner = turn === "w" ? "Obsidian (Black)" : "Marble (White)";
          statusText.textContent = `Checkmate! ${winner} Wins`;
          showGameOverModal(
            "CHECKMATE",
            `${winner} triumphs inside the Gothic Sanctuary.`,
          );
        } else if (
          game.in_draw() ||
          game.in_stalemate() ||
          game.in_threefold_repetition()
        ) {
          statusText.textContent = "Sanctuary Draw";
          showGameOverModal(
            "STALEMATE / DRAW",
            "Neither Marble nor Obsidian claims dominion today.",
          );
        } else {
          const sideName =
            turn === "w"
              ? "Marble's Turn"
              : vsAI
                ? "Wizard AI Thinking..."
                : "Obsidian's Turn";
          if (game.in_check()) {
            statusText.textContent = `${sideName} — CHECK!`;
            statusPill.classList.add("check-pulse", "border-red-500/70");
          } else {
            statusText.textContent = sideName;
          }
        }
      }

      function showGameOverModal(title, subtitle) {
        const modal = document.getElementById("gameover-modal");
        const card = document.getElementById("gameover-card");
        document.getElementById("gameover-title").textContent = title;
        document.getElementById("gameover-subtitle").textContent = subtitle;
        modal.classList.remove("opacity-0", "pointer-events-none");
        card.classList.remove("scale-95");
        card.classList.add("scale-100");
      }

      function hideGameOverModal() {
        const modal = document.getElementById("gameover-modal");
        const card = document.getElementById("gameover-card");
        modal.classList.add("opacity-0", "pointer-events-none");
        card.classList.add("scale-95");
        card.classList.remove("scale-100");
      }

      function resetGame() {
        hideGameOverModal();
        currentMoveAnimation = null;
        isAnimating = false;
        selectedSquare = null;
        legalMovesForSelected = [];
        clearSquareHighlights();
        for (let i = 0; i < SHARD_POOL_SIZE; i++) {
          shardPool[i].active = false;
          shardPool[i].mesh.visible = false;
        }
        game.reset();
        syncFullBoardFromState();
        showCombatBanner("The Sanctuary Board is Reset");
      }

      document.getElementById("btn-mode").addEventListener("click", () => {
        vsAI = !vsAI;
        const btn = document.getElementById("btn-mode");
        const icon = document.getElementById("icon-mode");
        const label = document.getElementById("label-mode");

        if (vsAI) {
          btn.classList.add("md-chip-active");
          icon.textContent = "smart_toy";
          label.textContent = "vs Wizard AI";
          if (!game.game_over() && game.turn() === "b" && !isAnimating) {
            setTimeout(scheduleWizardAIMove, 200);
          }
        } else {
          btn.classList.remove("md-chip-active");
          icon.textContent = "group";
          label.textContent = "2 Players";
        }
        updateHUDStatus();
      });

      document.getElementById("btn-camera").addEventListener("click", () => {
        cameraState.presetIndex =
          (cameraState.presetIndex + 1) % cameraPresets.length;
        const preset = cameraPresets[cameraState.presetIndex];
        cameraState.targetTheta = preset.theta;
        cameraState.targetPhi = preset.phi;
        cameraState.targetRadius = preset.radius;
        document.getElementById("label-camera").textContent = preset.name;
      });

      document.getElementById("btn-sound").addEventListener("click", () => {
        soundFX.enabled = !soundFX.enabled;
        document.getElementById("icon-sound").textContent = soundFX.enabled
          ? "volume_up"
          : "volume_off";
      });

      document.getElementById("btn-reset").addEventListener("click", resetGame);
      document
        .getElementById("btn-modal-restart")
        .addEventListener("click", resetGame);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /***********************************************************************
       * 12. ULTRA-SMOOTH 60 FPS RENDER LOOP
       ***********************************************************************/
      const clock = new THREE.Clock();
      const fpsBadge = document.getElementById("fps-badge");
      let frameCount = 0;
      let fpsAccum = 0;

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);
        const elapsed = clock.getElapsedTime();

        // Live FPS Counter
        frameCount++;
        fpsAccum += dt;
        if (fpsAccum >= 0.5) {
          const currentFps = Math.min(60, Math.round(frameCount / fpsAccum));
          fpsBadge.textContent = `${currentFps} FPS`;
          frameCount = 0;
          fpsAccum = 0;
        }

        // 1. Smoothly Interpolate Camera Orbit
        cameraState.theta +=
          (cameraState.targetTheta - cameraState.theta) * 0.1;
        cameraState.phi += (cameraState.targetPhi - cameraState.phi) * 0.1;
        cameraState.radius +=
          (cameraState.targetRadius - cameraState.radius) * 0.1;

        const sinPhi = Math.sin(cameraState.phi);
        camera.position.x =
          cameraState.radius * sinPhi * Math.sin(cameraState.theta);
        camera.position.y = cameraState.radius * Math.cos(cameraState.phi);
        camera.position.z =
          cameraState.radius * sinPhi * Math.cos(cameraState.theta);
        camera.lookAt(0, 0.7, 0);

        // 2. Subtle Cathedral Dust Rotation
        const dust = scene.getObjectByName("cathedralDust");
        if (dust) {
          dust.rotation.y = elapsed * 0.02;
        }

        // 3. Piece Idle Breathing & Selection Levitation
        for (const sq in activePieceMeshes) {
          const piece = activePieceMeshes[sq];
          if (
            currentMoveAnimation &&
            (currentMoveAnimation.attacker === piece ||
              currentMoveAnimation.defender === piece)
          ) {
            continue;
          }
          const breath = Math.sin(elapsed * 2.2 + piece.idlePhase);
          const isSelected = sq === selectedSquare;
          const targetY = isSelected
            ? 0.36 + breath * 0.07
            : Math.max(0, breath * 0.035);
          piece.mesh.position.y += (targetY - piece.mesh.position.y) * 0.16;
        }

        // 4. Active Move & Attack Lunge Animation
        if (currentMoveAnimation) {
          const anim = currentMoveAnimation;
          anim.elapsed += dt;
          const t = Math.min(anim.elapsed / anim.duration, 1.0);

          if (!anim.isCapture) {
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            anim.attacker.mesh.position.lerpVectors(
              anim.startPos,
              anim.endPos,
              ease,
            );
            const arcHeight = anim.attacker.type === "n" ? 2.3 : 0.55;
            anim.attacker.mesh.position.y = Math.sin(t * Math.PI) * arcHeight;
            anim.attacker.mesh.rotation.x = Math.sin(t * Math.PI * 2) * 0.1;

            if (anim.rookCastleAnim) {
              anim.rookCastleAnim.piece.mesh.position.lerpVectors(
                anim.rookCastleAnim.startPos,
                anim.rookCastleAnim.endPos,
                ease,
              );
            }
          } else {
            const strikePoint = 0.6;
            if (t < strikePoint) {
              const p = t / strikePoint;
              const ease = p * p * (3 - 2 * p);
              anim.attacker.mesh.position.lerpVectors(
                anim.startPos,
                anim.approachTarget,
                ease,
              );
              anim.attacker.mesh.position.y = Math.sin(p * Math.PI) * 1.05;
              anim.attacker.mesh.rotation.x = -Math.sin(p * Math.PI) * 0.36;

              if (anim.defender) {
                anim.defender.mesh.position.x =
                  anim.defender.basePos.x + (Math.random() - 0.5) * 0.11 * p;
                anim.defender.mesh.position.z =
                  anim.defender.basePos.z + (Math.random() - 0.5) * 0.11 * p;
              }
            } else {
              if (!anim.shattered) {
                anim.shattered = true;
                soundFX.playAttackStrike();
                const shatterOrigin = anim.defender
                  ? anim.defender.basePos
                  : anim.endPos;
                triggerShatterExplosion(
                  shatterOrigin,
                  anim.defender ? anim.defender.color : "b",
                );
                if (anim.defender) {
                  piecesGroup.remove(anim.defender.mesh);
                }
              }
              const p2 = (t - strikePoint) / (1 - strikePoint);
              anim.attacker.mesh.position.lerpVectors(
                anim.approachTarget,
                anim.endPos,
                p2,
              );
              anim.attacker.mesh.position.y = (1 - p2) * 0.32;
              anim.attacker.mesh.rotation.x =
                Math.sin((1 - p2) * Math.PI) * 0.38;
            }
          }

          if (t >= 1.0) {
            finalizeAnimatedMove(anim);
          }
        }

        // 5. Update Pooled Shatter Shards
        for (let i = 0; i < SHARD_POOL_SIZE; i++) {
          const frag = shardPool[i];
          if (!frag.active) continue;

          frag.vel.y -= 17.0 * dt;
          frag.mesh.position.addScaledVector(frag.vel, dt);
          frag.mesh.rotation.x += frag.rotVel.x * dt;
          frag.mesh.rotation.y += frag.rotVel.y * dt;
          frag.mesh.rotation.z += frag.rotVel.z * dt;

          if (frag.mesh.position.y < 0.08) {
            frag.mesh.position.y = 0.08;
            frag.vel.y *= -0.4;
            frag.vel.x *= 0.72;
            frag.vel.z *= 0.72;
          }

          frag.life -= dt * 0.65;
          if (frag.life < 0.35) {
            frag.mesh.scale.setScalar(Math.max(0.01, frag.life * 2.2));
          }
          if (frag.life <= 0) {
            frag.active = false;
            frag.mesh.visible = false;
          }
        }

        renderer.render(scene, camera);
      }

      window.onload = function () {
        syncFullBoardFromState();
        animate();
      };
    </script>
  </body>
